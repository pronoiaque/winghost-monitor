name: build-windows

# Produit le binaire mono-fichier Windows `winmonitor.exe` via PyInstaller.
# PyInstaller ne sait pas cross-compiler : le build tourne donc sur un runner
# `windows-latest`. L'exe est publié comme artefact à chaque push, et publié
# en Release de deux façons :
#   - automatiquement sur push d'un tag `v*` ;
#   - à la demande via « Run workflow » (input release=true) : aucun `git push`
#     de tag n'est requis — l'action softprops crée le tag `vX.Y.Z` (lu dans
#     version.py) directement côté GitHub via le GITHUB_TOKEN.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publier une Release (crée le tag vX.Y.Z depuis version.py)"
        type: boolean
        default: false

permissions:
  contents: write   # nécessaire pour créer le tag + la Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Garde-fou — cohérence des versions
        run: python tools/check_version.py

      - name: Installer les dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compiler le binaire (PyInstaller)
        run: pyinstaller --noconfirm --clean winghost-monitor.spec

      - name: Vérifier que l'exe se lance
        run: .\dist\winmonitor.exe --version

      - name: Lire la version applicative
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: winmonitor-exe
          path: dist/winmonitor.exe
          if-no-files-found: error

      # Release : soit sur push de tag v*, soit à la demande (input release=true).
      # softprops crée le tag vX.Y.Z lui-même si absent → pas de git push de tag.
      - name: Publier la Release (tag + exe)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: WinGhost Monitor ${{ steps.ver.outputs.version }}
          files: dist/winmonitor.exe
